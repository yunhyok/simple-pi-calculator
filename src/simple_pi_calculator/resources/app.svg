<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a41"/>
      <stop offset="1" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#5aa8ff"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="0.55" stop-color="#ff7a5c"/>
      <stop offset="1" stop-color="#ff4d8d"/>
    </linearGradient>
  </defs>

  <!-- rounded square base (app-icon style) -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#3a4a63" stroke-width="1"/>

  <!-- PDN plane stack: two chip/plane rectangles suggesting PWR/GND cavity -->
  <g opacity="0.95">
    <rect x="46" y="150" width="164" height="18" rx="4" fill="url(#plane)"/>
    <rect x="46" y="176" width="164" height="10" rx="3" fill="#17233a"/>
    <rect x="46" y="192" width="164" height="18" rx="4" fill="#3d5877"/>
  </g>

  <!-- via studs connecting plane pair -->
  <g fill="#9fc2ff">
    <rect x="66" y="166" width="8" height="28" rx="2"/>
    <rect x="122" y="166" width="8" height="28" rx="2"/>
    <rect x="182" y="166" width="8" height="28" rx="2"/>
  </g>

  <!-- impedance curve |Z(f)| rising toward resonance, on log-log style axes -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- axes -->
    <path d="M 44 138 L 44 40" stroke="#5c7091" stroke-width="3"/>
    <path d="M 44 138 L 212 138" stroke="#5c7091" stroke-width="3"/>

    <!-- impedance trace: capacitive slope down, resonant peak, inductive slope up -->
    <path d="M 50 70
             C 66 96, 80 112, 96 118
             C 108 122.5, 118 123, 128 120
             C 137 74, 143 50, 150 46
             C 158 52, 168 82, 182 112
             C 192 128, 200 132, 208 134"
          stroke="url(#curve)" stroke-width="7"/>

    <!-- resonance peak marker -->
    <circle cx="150" cy="46" r="6.5" fill="#fff3e0" stroke="#ff8a5c" stroke-width="2.5"/>
  </g>
</svg>
