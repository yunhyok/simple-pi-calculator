<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" width="900" height="470" viewBox="0 0 900 470">
  <title>Stack-up cross-section with PWR/GND pair, vias, decap and PAD</title>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="26" font-family="Arial" font-size="18" font-weight="bold" fill="#1a3d6d" text-anchor="middle">Stack-up cross-section (bundled example, VDD_CORE: PWR layer 5, GND layer 3)</text>

  <!-- layer rows: x 170..700 -->
  <!-- L1 TOP (signal/pads) 110-124 -->
  <rect x="170" y="110" width="530" height="14" fill="#ffffff" stroke="#c87533" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- L2 PP1 124-154 -->
  <rect x="170" y="124" width="530" height="30" fill="#cfe8c6"/>
  <!-- L3 GND1 154-168 (GND plane) with anti-pads around PWR vias at x=230 and x=540 -->
  <rect x="170" y="154" width="530" height="14" fill="#c87533"/>
  <rect x="219" y="154" width="22" height="14" fill="#cfe8c6"/>
  <rect x="529" y="154" width="22" height="14" fill="#cfe8c6"/>
  <rect x="170" y="154" width="530" height="14" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
  <!-- L4 CORE1 168-198 -->
  <rect x="170" y="168" width="530" height="30" fill="#cfe8c6"/>
  <!-- L5 PWR1 198-212 (PWR plane) -->
  <rect x="170" y="198" width="530" height="14" fill="#c87533"/>
  <rect x="170" y="198" width="530" height="14" fill="none" stroke="#d62728" stroke-width="2.5"/>
  <!-- L6 PP2 212-272 -->
  <rect x="170" y="212" width="530" height="60" fill="#cfe8c6"/>
  <!-- L7 PWR2 272-286 -->
  <rect x="170" y="272" width="530" height="14" fill="#c87533"/>
  <!-- L8 CORE2 286-316 -->
  <rect x="170" y="286" width="530" height="30" fill="#cfe8c6"/>
  <!-- L9 GND2 316-330 -->
  <rect x="170" y="316" width="530" height="14" fill="#c87533"/>
  <!-- L10 PP3 330-360 -->
  <rect x="170" y="330" width="530" height="30" fill="#cfe8c6"/>
  <!-- L11 BOTTOM 360-374 -->
  <rect x="170" y="360" width="530" height="14" fill="#ffffff" stroke="#c87533" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- layer labels -->
  <text x="160" y="121" font-family="Arial" font-size="12" fill="#333333" text-anchor="end">1  TOP (pads)</text>
  <text x="160" y="143" font-family="Arial" font-size="12" fill="#333333" text-anchor="end">2  PP1</text>
  <text x="160" y="165" font-family="Arial" font-size="12" font-weight="bold" fill="#2b6cb0" text-anchor="end">3  GND1</text>
  <text x="160" y="187" font-family="Arial" font-size="12" fill="#333333" text-anchor="end">4  CORE1</text>
  <text x="160" y="209" font-family="Arial" font-size="12" font-weight="bold" fill="#d62728" text-anchor="end">5  PWR1</text>
  <text x="160" y="246" font-family="Arial" font-size="12" fill="#333333" text-anchor="end">6  PP2</text>
  <text x="160" y="283" font-family="Arial" font-size="12" fill="#333333" text-anchor="end">7  PWR2</text>
  <text x="160" y="305" font-family="Arial" font-size="12" fill="#333333" text-anchor="end">8  CORE2</text>
  <text x="160" y="327" font-family="Arial" font-size="12" fill="#333333" text-anchor="end">9  GND2</text>
  <text x="160" y="349" font-family="Arial" font-size="12" fill="#333333" text-anchor="end">10  PP3</text>
  <text x="160" y="371" font-family="Arial" font-size="12" fill="#333333" text-anchor="end">11  BOTTOM</text>
  <text x="20" y="100" font-family="Arial" font-size="12" font-weight="bold" fill="#555555">Layer # / name</text>

  <!-- z axis -->
  <line x1="712" y1="110" x2="712" y2="385" stroke="#555555" stroke-width="1"/>
  <polygon points="712,393 707,383 717,383" fill="#555555"/>
  <text x="720" y="118" font-family="Arial" font-size="12" fill="#555555">z = 0 (Top surface)</text>
  <text x="720" y="392" font-family="Arial" font-size="12" fill="#555555">z</text>

  <!-- ===== decap on Top ===== -->
  <rect x="220" y="106" width="20" height="4" fill="#c87533"/>
  <rect x="280" y="106" width="20" height="4" fill="#c87533"/>
  <rect x="238" y="88" width="44" height="18" rx="2" fill="#8c8c8c" stroke="#555555" stroke-width="1"/>
  <rect x="226" y="88" width="12" height="18" fill="#bdbdbd" stroke="#555555" stroke-width="1"/>
  <rect x="282" y="88" width="12" height="18" fill="#bdbdbd" stroke="#555555" stroke-width="1"/>
  <text x="260" y="80" font-family="Arial" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">Decap</text>
  <!-- decap PWR via (to layer 5) and GND via (to layer 3) -->
  <rect x="226" y="110" width="8" height="95" fill="#d62728"/>
  <rect x="286" y="110" width="8" height="51" fill="#2b6cb0"/>

  <!-- ===== IC / PAD on Top ===== -->
  <rect x="505" y="52" width="100" height="30" rx="2" fill="#4a4a4a"/>
  <text x="555" y="72" font-family="Arial" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">IC</text>
  <circle cx="540" cy="94" r="8" fill="#b0b0b0" stroke="#555555" stroke-width="1"/>
  <circle cx="600" cy="94" r="8" fill="#b0b0b0" stroke="#555555" stroke-width="1"/>
  <rect x="530" y="106" width="20" height="4" fill="#c87533"/>
  <rect x="590" y="106" width="20" height="4" fill="#c87533"/>
  <rect x="536" y="110" width="8" height="95" fill="#d62728"/>
  <rect x="596" y="110" width="8" height="51" fill="#2b6cb0"/>
  <text x="640" y="72" font-family="Arial" font-size="12" font-weight="bold" fill="#a31b1b">PAD</text>
  <text x="640" y="87" font-family="Arial" font-size="11" fill="#a31b1b">(observation port)</text>

  <!-- cavity current -->
  <line x1="245" y1="183" x2="520" y2="183" stroke="#3c7a2e" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="528,183 518,178 518,188" fill="#3c7a2e"/>
  <text x="385" y="194" font-family="Arial" font-size="11" fill="#2d5e22" text-anchor="middle">cavity (plane pair) carries the current PAD ↔ decap</text>

  <!-- dimension: s_v -->
  <line x1="230" y1="60" x2="290" y2="60" stroke="#333333" stroke-width="1"/>
  <polygon points="230,60 238,56 238,64" fill="#333333"/>
  <polygon points="290,60 282,56 282,64" fill="#333333"/>
  <line x1="230" y1="55" x2="230" y2="86" stroke="#999999" stroke-width="0.8"/>
  <line x1="290" y1="55" x2="290" y2="86" stroke="#999999" stroke-width="0.8"/>
  <text x="260" y="50" font-family="Arial" font-size="12" fill="#333333" text-anchor="middle">s_v (via pitch)</text>

  <!-- brackets h_near, t_near, d at x=390 -->
  <line x1="380" y1="110" x2="400" y2="110" stroke="#333333" stroke-width="1"/>
  <line x1="380" y1="154" x2="400" y2="154" stroke="#333333" stroke-width="1"/>
  <line x1="390" y1="110" x2="390" y2="154" stroke="#333333" stroke-width="1"/>
  <text x="406" y="136" font-family="Arial" font-size="12" fill="#333333">h_near = z_top(3) = 0.135 mm</text>
  <line x1="640" y1="154" x2="660" y2="154" stroke="#333333" stroke-width="1"/>
  <line x1="650" y1="154" x2="650" y2="168" stroke="#333333" stroke-width="2"/>
  <text x="664" y="161" font-family="Arial" font-size="11" fill="#333333">t_near</text>
  <line x1="640" y1="168" x2="660" y2="168" stroke="#333333" stroke-width="1"/>
  <line x1="640" y1="198" x2="660" y2="198" stroke="#333333" stroke-width="1"/>
  <line x1="650" y1="168" x2="650" y2="198" stroke="#333333" stroke-width="1"/>
  <text x="664" y="189" font-family="Arial" font-size="12" font-weight="bold" fill="#2d5e22">d</text>

  <!-- tags -->
  <text x="720" y="165" font-family="Arial" font-size="12" font-weight="bold" fill="#2b6cb0">GND layer (nearer)</text>
  <text x="720" y="209" font-family="Arial" font-size="12" font-weight="bold" fill="#d62728">PWR layer</text>
  <text x="720" y="187" font-family="Arial" font-size="11" fill="#2d5e22">cavity gap d</text>

  <!-- legend -->
  <rect x="720" y="245" width="18" height="12" fill="#c87533"/>
  <text x="744" y="256" font-family="Arial" font-size="12" fill="#333333">metal: σ &gt; 0</text>
  <rect x="720" y="265" width="18" height="12" fill="#cfe8c6"/>
  <text x="744" y="276" font-family="Arial" font-size="12" fill="#333333">dielectric: σ empty/0</text>
  <rect x="724" y="285" width="8" height="14" fill="#d62728"/>
  <text x="744" y="297" font-family="Arial" font-size="12" fill="#333333">PWR via</text>
  <rect x="724" y="305" width="8" height="14" fill="#2b6cb0"/>
  <text x="744" y="317" font-family="Arial" font-size="12" fill="#333333">GND via</text>
  <rect x="720" y="326" width="18" height="12" fill="#c87533"/>
  <rect x="725" y="326" width="8" height="12" fill="#cfe8c6"/>
  <text x="744" y="337" font-family="Arial" font-size="12" fill="#333333">anti-pad (clearance)</text>

  <text x="20" y="420" font-family="Arial" font-size="12" fill="#444444">• Layer 1 is the top of the stack-up; z grows downward. Decaps and the PAD are on the Top side (fixed in v1). Not to scale.</text>
  <text x="20" y="440" font-family="Arial" font-size="12" fill="#444444">• Each via pair has a PWR via and a GND via at pitch s_v. The via loop ends at the nearer plane (here GND, layer 3);</text>
  <text x="20" y="458" font-family="Arial" font-size="12" fill="#444444">   only the via continuing to the far plane crosses the cavity d, which is part of the cavity model, not of the via model.</text>
</svg>
