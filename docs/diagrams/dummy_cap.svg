  <circle cx="134" cy="400" r="8" fill="#2b6cb0" stroke="#173d66" stroke-width="1"/>
  <rect x="70" y="386" width="80" height="28" fill="none" stroke="#3c7a2e" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="110" y="435" font-family="Arial" font-size="12" fill="#2d5e22" text-anchor="middle">port 1</text>
  <text x="110" y="451" font-family="Arial" font-size="11" fill="#555555" text-anchor="middle">2 caps</text>
  <rect x="282" y="300" width="36" height="22" fill="#8c8c8c" stroke="#555555" stroke-width="1"/>
  <rect x="268" y="300" width="16" height="22" fill="#c87533"/>
  <rect x="316" y="300" width="16" height="22" fill="#c87533"/>
  <rect x="282" y="336" width="36" height="22" fill="#8c8c8c" stroke="#555555" stroke-width="1"/>
  <rect x="268" y="336" width="16" height="22" fill="#c87533"/>
  <rect x="316" y="336" width="16" height="22" fill="#c87533"/>
  <text x="300" y="351" font-family="Arial" font-size="10" fill="#ffffff" text-anchor="middle">dummy</text>
  <rect x="273" y="322" width="6" height="14" fill="#c87533"/>
  <rect x="321" y="322" width="6" height="14" fill="#c87533"/>
  <rect x="273" y="358" width="6" height="42" fill="#c87533"/>
  <rect x="321" y="358" width="6" height="42" fill="#c87533"/>
  <circle cx="276" cy="400" r="8" fill="#d62728" stroke="#7a1010" stroke-width="1"/>
  <circle cx="324" cy="400" r="8" fill="#2b6cb0" stroke="#173d66" stroke-width="1"/>
  <rect x="260" y="386" width="80" height="28" fill="none" stroke="#3c7a2e" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="300" y="435" font-family="Arial" font-size="12" fill="#2d5e22" text-anchor="middle">port 2</text>
  <text x="300" y="451" font-family="Arial" font-size="11" fill="#555555" text-anchor="middle">2 caps</text>
  <rect x="472" y="336" width="36" height="22" fill="#8c8c8c" stroke="#555555" stroke-width="1"/>
  <rect x="458" y="336" width="16" height="22" fill="#c87533"/>
  <rect x="506" y="336" width="16" height="22" fill="#c87533"/>
  <rect x="463" y="358" width="6" height="42" fill="#c87533"/>
  <rect x="511" y="358" width="6" height="42" fill="#c87533"/>
  <circle cx="466" cy="400" r="8" fill="#d62728" stroke="#7a1010" stroke-width="1"/>
  <circle cx="514" cy="400" r="8" fill="#2b6cb0" stroke="#173d66" stroke-width="1"/>
  <rect x="450" y="386" width="80" height="28" fill="none" stroke="#3c7a2e" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="490" y="435" font-family="Arial" font-size="12" fill="#2d5e22" text-anchor="middle">port 3</text>
  <text x="490" y="451" font-family="Arial" font-size="11" fill="#555555" text-anchor="middle">1 cap</text>
  <text x="590" y="320" font-family="Arial" font-size="12" fill="#333333">Ports with 2 capacitors:</text>
  <text x="590" y="342" font-family="Arial" font-size="13" font-weight="bold" fill="#222222">Z_L = Z_cap / 2 + Z_via,dec</text>
  <text x="590" y="372" font-family="Arial" font-size="12" fill="#333333">Last port when N is odd:</text>
  <text x="590" y="394" font-family="Arial" font-size="13" font-weight="bold" fill="#222222">Z_L = Z_cap + Z_via,dec</text>
  <text x="590" y="424" font-family="Arial" font-size="11" fill="#555555">The shared via set stays in series and is</text>
  <text x="590" y="439" font-family="Arial" font-size="11" fill="#555555">not divided. N = 1: flag has no effect.</text>
  <text x="30" y="478" font-family="Arial" font-size="11" fill="#555555">Legend: red = PWR via, blue = GND via, dashed box = one via set = one cavity port. Mutual coupling between the two capacitors is neglected.</text>
</svg>
