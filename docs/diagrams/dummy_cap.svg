  <circle cx="474" cy="165" r="8" fill="#2b6cb0" stroke="#173d66" stroke-width="1"/>
  <rect x="410" y="151" width="80" height="28" fill="none" stroke="#3c7a2e" stroke-width="1.2" stroke-dasharray="4,3"/>
