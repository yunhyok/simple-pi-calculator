<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" width="900" height="500" viewBox="0 0 900 500">
  <title>Dummy Cap: capacitors sharing one via set</title>
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <text x="450" y="28" font-family="Arial" font-size="18" font-weight="bold" fill="#1a3d6d" text-anchor="middle">Dummy Cap option: N = 5 capacitors in one decap row (top view)</text>
  <rect x="15" y="50" width="870" height="190" rx="6" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1"/>
  <text x="30" y="74" font-family="Arial" font-size="14" font-weight="bold" fill="#1a3d6d">Dummy Cap = No  →  P = N = 5 via sets (cavity ports), 1 capacitor per port</text>
  <rect x="72" y="95" width="36" height="22" fill="#8c8c8c" stroke="#555555" stroke-width="1"/>
  <rect x="58" y="95" width="16" height="22" fill="#c87533"/>
  <rect x="106" y="95" width="16" height="22" fill="#c87533"/>
  <rect x="63" y="117" width="6" height="48" fill="#c87533"/>
