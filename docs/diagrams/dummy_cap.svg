  <rect x="538" y="95" width="16" height="22" fill="#c87533"/>
  <rect x="586" y="95" width="16" height="22" fill="#c87533"/>
  <rect x="543" y="117" width="6" height="48" fill="#c87533"/>
  <rect x="591" y="117" width="6" height="48" fill="#c87533"/>
  <circle cx="546" cy="165" r="8" fill="#d62728" stroke="#7a1010" stroke-width="1"/>
  <circle cx="594" cy="165" r="8" fill="#2b6cb0" stroke="#173d66" stroke-width="1"/>
  <rect x="530" y="151" width="80" height="28" fill="none" stroke="#3c7a2e" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="570" y="200" font-family="Arial" font-size="12" fill="#2d5e22" text-anchor="middle">port 5</text>
  <text x="570" y="216" font-family="Arial" font-size="11" fill="#555555" text-anchor="middle">1 cap</text>
  <text x="650" y="120" font-family="Arial" font-size="12" fill="#333333">Each port load:</text>
  <text x="650" y="142" font-family="Arial" font-size="13" font-weight="bold" fill="#222222">Z_L = Z_cap + Z_via,dec</text>
  <text x="650" y="170" font-family="Arial" font-size="11" fill="#555555">5 via sets are placed across the</text>
  <text x="650" y="185" font-family="Arial" font-size="11" fill="#555555">plane width (5 ports in the row).</text>
  <rect x="15" y="255" width="870" height="235" rx="6" fill="#fdf8f2" stroke="#e7d3bd" stroke-width="1"/>
  <text x="30" y="279" font-family="Arial" font-size="14" font-weight="bold" fill="#8a4a16">Dummy Cap = Yes  →  P = ceil(5/2) = 3 via sets, capacitors per port [2, 2, 1]</text>
  <rect x="92" y="300" width="36" height="22" fill="#8c8c8c" stroke="#555555" stroke-width="1"/>
  <rect x="78" y="300" width="16" height="22" fill="#c87533"/>
