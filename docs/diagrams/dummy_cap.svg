  <text x="210" y="216" font-family="Arial" font-size="11" fill="#555555" text-anchor="middle">1 cap</text>
  <rect x="312" y="95" width="36" height="22" fill="#8c8c8c" stroke="#555555" stroke-width="1"/>
  <rect x="298" y="95" width="16" height="22" fill="#c87533"/>
