  <rect x="126" y="336" width="16" height="22" fill="#c87533"/>
  <text x="110" y="351" font-family="Arial" font-size="10" fill="#ffffff" text-anchor="middle">dummy</text>
  <rect x="83" y="322" width="6" height="14" fill="#c87533"/>
  <rect x="131" y="322" width="6" height="14" fill="#c87533"/>
  <rect x="83" y="358" width="6" height="42" fill="#c87533"/>
  <rect x="131" y="358" width="6" height="42" fill="#c87533"/>
