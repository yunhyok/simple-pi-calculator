name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt/X11 runtime libraries for offscreen PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxrender1 \
            libxi6

      - name: Install package (dev extras)
        run: |
          pip install --upgrade pip
          if pip install -e ".[dev]"; then
            echo "installed via [dev] extra"
          else
            echo "[dev] extra not available; installing explicit test deps"
            pip install -e .
            pip install pytest pytest-qt
          fi

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
