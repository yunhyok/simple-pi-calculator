name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create a GitHub Release on tag builds

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # No fallback: a broken [dev] extra must fail the build loudly.
      - name: Install package (dev extras)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    name: Build installer
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev extras)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      # version     = X.Y.Z from __init__.py (Inno Setup AppVersion, file version resource)
      # artifact    = X.Y.Z on tags, X.Y.Z-dev+<short sha> otherwise (DESIGN.md §7.3)
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (python -c "import simple_pi_calculator as m; print(m.__version__)").Trim()
          if (-not $version) { Write-Error "Could not read __version__"; exit 1 }
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $artifact = $version
          } else {
            $sha = "${{ github.sha }}".Substring(0, 7)
            $artifact = "$version-dev+$sha"
          }
          Write-Host "Package version: $version, artifact version: $artifact"
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=$artifact" >> $env:GITHUB_OUTPUT

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = "v${{ steps.version.outputs.version }}"
          $actual = "${{ github.ref_name }}"
          if ($actual -ne $expected) {
            Write-Error "Tag '$actual' does not match package version '$expected'."
            exit 1
          }
          Write-Host "Tag '$actual' matches package version."

      - name: Generate version_info.txt
        shell: bash
        run: python tools/write_version_info.py packaging/version_info.txt

      - name: Build with PyInstaller
        shell: pwsh
        working-directory: packaging
        run: |
          pyinstaller simple_pi_calculator.spec --noconfirm --clean --distpath ../dist --workpath ../build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The exe is windowed (console=False): it prints nothing, so the step relies on the exit
      # code and shows the report file the app writes. The cmdlet has no timeout parameter;
      # WaitForExit enforces the 120 s limit.
      - name: Smoke test the frozen app
        shell: pwsh
        run: |
          $exe = "dist\SimplePICalculator\SimplePICalculator.exe"
          $report = Join-Path $env:RUNNER_TEMP "selftest.txt"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected executable not found at $exe"
            exit 1
          }
          $env:SPICAL_APPDATA_DIR = Join-Path $env:RUNNER_TEMP "selftest-appdata"
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-test", "--self-test-report", "`"$report`"" -PassThru
          if (-not $proc.WaitForExit(120000)) {
            $proc.Kill()
            Write-Error "Self-test timed out after 120 s"
            exit 1
          }
          if (Test-Path $report) { Get-Content $report | Write-Host } else { Write-Host "(no self-test report written)" }
          if ($proc.ExitCode -ne 0) {
            Write-Error "Self-test failed with exit code $($proc.ExitCode)"
            exit 1
          }
          Write-Host "Self-test OK"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup --no-progress -y
          }
          $possiblePaths = @(
            "C:\Program Files (x86)\Inno Setup 6",
            "C:\Program Files\Inno Setup 6"
          )
          foreach ($p in $possiblePaths) {
            if (Test-Path $p) {
              echo "$p" >> $env:GITHUB_PATH
            }
          }

      - name: Compile installer
        shell: pwsh
        working-directory: packaging
        run: |
          iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip onedir bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\SimplePICalculator\*" -DestinationPath "dist\SimplePICalculator-${{ steps.version.outputs.artifact }}-win64.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimplePICalculator-${{ steps.version.outputs.artifact }}
          path: |
            dist-installer/*.exe
            dist/SimplePICalculator-*-win64.zip
          if-no-files-found: error

      - name: Check for CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        shell: bash
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "path=CHANGELOG.md" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-installer/*.exe
            dist/SimplePICalculator-*-win64.zip
          body_path: ${{ steps.changelog.outputs.path }}
          generate_release_notes: ${{ steps.changelog.outputs.generate == 'true' }}
          fail_on_unmatched_files: true
